# >>> MATRIXGREENPRO >>> (bloco gerido pelo scripts/instalar.sh --mangohud; versão 2.1.0 | 01/11/2026)
# FPS REAL para a mini tela: o MangoHud grava uma linha por segundo (coluna "fps")
# e descarrega o arquivo a cada amostra; o painel lê a última linha.
# Quando nenhum jogo com MangoHud está rodando, o arquivo para de crescer e a tela mostra N/D.
output_folder=/tmp/mgp-mangohud
autostart_log=1
log_interval=1000
