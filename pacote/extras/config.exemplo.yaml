# MATRIX GREEN PRO | versão 3.9.0 | 08/11/2026 21:03 (-03) | discos pelo número de série (serie)
# histórico: 3.8.0 07/11/2026 21:00 limites de manuais e do Zabbix (RAM 90/95, discos 80/90)
# Configuração do painel. Edite à vontade: o instalador nunca sobrescreve
# este arquivo (use --forcar no mgp_detect.py para regenerar).
painel:
  demo: false              # true = dados demonstrativos (cabeçalho mostra DEMO)
  demo_cenario: normal     # normal | atencao | critico
  refresh_full_s: 300

cpu:
  temp_sensor: auto        # ex.: k10temp/Tctl  (veja scripts/diagnosticar.sh)
  fan: auto                # ex.: nct6798/fan2; auto usa CPU_FAN do config.yaml do programa
  temp_warn: auto          # auto = conforme o modelo detectado (Ryzen 7000/9000: 88/94 °C)
  temp_crit: auto
  fan_stop_ok_below_c: 60  # 0 RPM abaixo desta temperatura = modo semipassivo (normal)

gpu:
  index: 0
  temp_warn: auto          # auto = limite de desaceleração NVML - 10 °C
  temp_crit: auto          # auto = limite de desaceleração NVML - 3 °C
  vram_warn: 90
  vram_crit: 97

fps:
  mangohud_dir: /tmp/mgp-mangohud
  max_age_s: 3.5

ram: {warn: 90, crit: 95}

# Três discos. serie = nome do disco em /dev/disk/by-id (ls -l /dev/disk/by-id), ou só o número de série:
# não muda ao formatar. uuid (lsblk -f) e montagem ficam de reserva. Desmontado = DESMONTADO, sem alerta.
discos:
  - nome: "M.2"
    serie: ""       # ⚠️ NÃO DETECTADO: ex. nvme-Modelo_Do_SSD_NUMERODESERIE
    uuid: ""
    montagem: "/"
  - nome: "2T"
    serie: ""       # ⚠️ NÃO DETECTADO: ex. ata-ST2000DM006-2DM164_NUMERODESERIE
    uuid: ""
    montagem: ""
  - nome: "4T"
    serie: ""       # ⚠️ NÃO DETECTADO
    uuid: ""
    montagem: ""
disco_warn: 80
disco_crit: 90
disco_livre_warn_gb: 50
disco_livre_crit_gb: 10

rede:
  ethernet: "enp5s0"
  wifi: "nenhuma"
  ethernet_obrigatoria: false   # true = Ethernet caída gera aviso mesmo com Wi-Fi ativo

ping: {host: 8.8.8.8, intervalo_s: 5, warn_ms: 20, crit_ms: 100}   # verde até 20 ms, âmbar até 100 ms, vermelho acima

clima:
  cidade: "RIO DO SUL"
  latitude: -27.2139
  longitude: -49.6428
  intervalo_min: 15
  desatualizado_min: 45

energia:
  fonte: auto              # auto | none | hwmon | arquivo | tasmota | shelly_gen2
  arquivo: ""              # arquivo com watts (uma linha), atualizado por outro programa
  tipo_arquivo: tomada     # tomada | psu | estimativa
  host: ""                 # IP da tomada inteligente (tasmota/shelly_gen2)
  psu_watts: 0             # capacidade da fonte para alertas (0 = sem alerta)

histerese: {temperatura: 3, percentual: 2, ping_ms: 0}
alertas: {confirmar_s: 2, manter_s: 300}   # subida só depois de 2 s; âmbar e vermelho ficam no mínimo 5 min
